version: '3.8'
services:
mongo:
image: mongo:6
restart: unless-stopped
volumes:
- mongo-data:/data/db
ports:
- '27017:27017'
backend:
build: .
command: npm run dev
volumes:
- ./:/app
- /app/node_modules
ports:
- '4000:4000'
environment:
- MONGO_URI=mongodb://mongo:27017/malldb
- JWT_SECRET=devsecret
depends_on:
- mongo
volumes:
mongo-data:
